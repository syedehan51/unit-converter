<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converted — instant unit conversion</title>
<meta name="description" content="Fast, free unit converter for length, weight, temperature, volume, speed and area. No sign-up, no clutter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">⇄</span>
    <span class="brand-name">Converted</span>
  </div>
  <p class="brand-tag">Free unit converter. Fast, simple, no sign-up</p>
</header>

<main class="panel">

  <nav class="category-index" id="categoryIndex" aria-label="Conversion category">
    <!-- populated by JS -->
  </nav>

  <section class="instrument" aria-live="polite">

    <div class="io-row">
      <div class="io-block">
        <label class="io-label" for="fromValue">FROM</label>
        <input type="number" id="fromValue" class="io-value" value="1" inputmode="decimal" autocomplete="off">
        <select id="fromUnit" class="io-unit"></select>
      </div>

      <button id="swapBtn" class="caliper-btn" type="button" aria-label="Swap units">
        <svg viewBox="0 0 48 24" width="40" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 8h30M32 8l-6-6M32 8l-6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M46 16H16M16 16l6-6M16 16l6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="io-block">
        <label class="io-label" for="toUnit">TO</label>
        <div class="io-readout" id="toValue">0</div>
        <select id="toUnit" class="io-unit"></select>
      </div>
    </div>

    <p class="conversion-line" id="conversionLine">1 unit = 1 unit</p>

  </section>

</main>

<footer class="site-footer">
  <a href="/about">About</a>
  <span class="dot">·</span>
  <a href="/contact">Contact</a>
  <span class="dot">·</span>
  <a href="/privacy">Privacy policy</a>
  <span class="dot">·</span>
  <span>No data leaves your browser — all conversions run locally.</span>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
